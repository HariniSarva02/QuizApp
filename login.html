<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image :url("https://t4.ftcdn.net/jpg/05/24/20/77/360_F_524207725_cDk3moNgO4NYGQpogqLpoOWANpc9vzCF.jpg");
      background-repeat: no-repeat; 
      background-size: cover;
      background-position: center top;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: #3388f7;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(30, 3, 79, 0.1);
      width: 400px;
    }
    .login-container h1 {
      margin-bottom: 20px;
      font-size: 30px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
    }
    .form-group input {
      font-size: 20px;
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background-color: #2803e1;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 20px;
    }
    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();

      // Example logic: Validate input (you can enhance this part)
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username == password) {
        // Redirect to the quiz app
        window.location.href = 'index.html'; // Replace 'quiz.html' with the actual path to your quiz app
      } else {
        alert('Please enter a username and password same.');
      }
    });
  </script>
</body>
</html>
